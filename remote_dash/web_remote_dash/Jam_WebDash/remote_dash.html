        <script>

            $(document).ready(function(){
                const callTime = setInterval(getTimeHRMINS, 10);
                const callNewData = setInterval(pull_data, 1000);
                const callErrorbank = setInterval(FalseError, 100000);
            });

            const initial_timestamp = new Date();
            const initial_milliseconds = initial_timestamp.getTime();

            function getTimeHRMINS(){
                const timestamp = new Date();
                hour = timestamp.getHours();
                minute = timestamp.getMinutes();
                second = timestamp.getSeconds();
                secondDif = (timestamp.getTime() - initial_timestamp.getTime())/1000;
                hoursElapsed = Math.floor(secondDif/(60*60));
                minutesElapsed = Math.floor(((secondDif/(60))%60));
                secondsElapsed = Math.floor(secondDif%60);
                $("#time").text("Time: " + hour.toString().padStart(2, '0') + ":" + minute.toString().padStart(2, '0') + ":" + second.toString().padStart(2, '0') 
                + "\nElapsed Time: " + hoursElapsed.toString().padStart(2, '0') + ":" + minutesElapsed.toString().padStart(2, '0') + ":" + secondsElapsed.toString().padStart(2, '0'));
            }
            function FalseError(){
                    const errorstamp = new Date;
                    const node = document.createElement("p").cloneNode(false);
                    document.getElementById("ErrorBackBorder").appendChild(node);
                    document.getElementById("ErrorBackBorder").lastChild.innerHTML = "Error! Not really " + errorstamp;
                    document.getElementById("ErrorBackBorder").lastChild.addEventListener('click', function() {this.remove();});
                    document.getElementById("ErrorBackBorder").lastChild.style.cursor = "pointer"; 
            }

        </script>
